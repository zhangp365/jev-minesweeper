<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Minesweeper</title>
<link rel="icon" href="data:,">
<script type="text/javascript" src="js/rocket.12.06.js"></script>
<script type="text/javascript" src="js/seedrandom.js"></script>
<script type="text/javascript" src="js/minesweeper.js"></script>
<script type="text/javascript" src="js/tile.js"></script>
<script type="text/javascript" src="js/face.js"></script>
<script type="text/javascript" src="js/grid.js"></script>
<script type="text/javascript" src="js/ssd.js"></script>
<script type="text/javascript" src="js/automation.js"></script>
<script type="text/javascript" src="js/jev-panel.js"></script>
<script type="text/javascript" src="js/fit-board.js"></script>
<link rel="stylesheet" href="css/minesweeper.css">
</head>
<body>
<main id="workspace">
  <section id="game_panel">
    <h1>Minesweeper</h1>
    <div id="level_buttons">
      <button id="button_beginner" aria-pressed="false">Beginner</button>
      <button id="button_intermediate" aria-pressed="false">Intermediate</button>
      <button id="button_expert" aria-pressed="false">Expert</button>
      <button id="button_rerun">Replay</button>
    </div>
    <div id="play_area"></div>
  </section>
  <aside id="jev_panel" aria-label="Model debug panel">
    <h2>Model Requests and Responses</h2>
    <div id="jev_provider">
      <span id="jev_provider_label">Provider: waiting for automation...</span>
      <select id="jev_provider_select" hidden></select>
    </div>
    <p id="jev_status">Waiting for automation. API keys are never shown on this page.</p>
    <div id="jev_log" aria-live="polite"></div>
  </aside>
</main>
</body>
</html>
